<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Stacking context: grid item with z-index paints atomically</title>
    <style>
        body {
            margin: 0;
            width: 200px;
        }

        .grid {
            display: grid;
            width: 200px;
            height: 100px;
            grid-template-columns: 200px;
            grid-template-rows: 100px;
        }

        .item1 {
            grid-column: 1;
            grid-row: 1;
            background: #008000;
            z-index: 1;
        }

        .item2 {
            grid-column: 1;
            grid-row: 1;
            background: #ff0000;
        }
    </style>
</head>

<body>
    <div class="grid">
        <div class="item1"></div>
        <div class="item2"></div>
    </div>
</body>

</html>
