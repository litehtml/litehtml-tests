<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Stacking context: positioned element with z-index traps positioned children</title>
    <style>
        body {
            margin: 0;
            width: 200px;
        }

        .page {
            position: relative;
            height: 100px;
        }

        .wrapper {
            position: relative;
            z-index: 2;
        }

        .child {
            position: absolute;
            left: 20px;
            top: 20px;
            width: 40px;
            height: 40px;
            background: #008000;
            z-index: 10;
        }

        .sibling {
            position: absolute;
            left: 30px;
            top: 30px;
            width: 40px;
            height: 40px;
            background: #ff0000;
            z-index: 5;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="wrapper">
            <div class="child"></div>
        </div>
        <div class="sibling"></div>
    </div>
</body>

</html>
