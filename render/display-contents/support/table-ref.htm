<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Reference for display: contents in table layout</title>
    <style>
        body { margin: 0; width: 140px; }
        .page { position: relative; width: 140px; height: 100px; }
        .box { position: absolute; height: 20px; }
    </style>
</head>
<body>
    <div class="page">
        <div class="box" style="left:0;top:0;width:60px;background:#d33"></div>
        <div class="box" style="left:60px;top:0;width:80px;background:#3a6"></div>
        <div class="box" style="left:0;top:20px;width:60px;background:#36c"></div>
        <div class="box" style="left:60px;top:20px;width:80px;background:#da3"></div>
        <div class="box" style="left:0;top:50px;width:60px;background:#3a6"></div>
        <div class="box" style="left:60px;top:50px;width:80px;background:#36c"></div>
        <div class="box" style="left:0;top:80px;width:60px;background:#da3"></div>
        <div class="box" style="left:60px;top:80px;width:80px;background:#d33"></div>
    </div>
</body>
</html>
