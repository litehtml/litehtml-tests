<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Reference for display: contents in grid layout</title>
    <style>
        @font-face { font-family: Ahem; src: url(../../../fonts/ahem.ttf); }
        body { margin: 0; width: 215px; }
        .page { position: relative; width: 215px; height: 75px; }
        .box { position: absolute; height: 20px; }
        .text { position: absolute; top: 55px; left: 0; font: 20px/20px Ahem; color: #d33; }
        .green { color: #3a6; }
    </style>
</head>
<body>
    <div class="page">
        <div class="box" style="left:0;top:0;width:50px;background:#3a6"></div>
        <div class="box" style="left:55px;top:0;width:50px;background:#d33"></div>
        <div class="box" style="left:110px;top:0;width:105px;background:#36c"></div>
        <div class="box" style="left:0;top:25px;width:50px;background:#a4a"></div>
        <div class="box" style="left:55px;top:25px;width:50px;background:#0af"></div>
        <div class="box" style="left:110px;top:25px;width:50px;background:#da3"></div>
        <div class="text">X<span class="green">Y</span>Z</div>
        <div class="box" style="left:80px;top:55px;width:135px;background:#36c"></div>
    </div>
</body>
</html>
