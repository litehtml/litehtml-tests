<!doctype html>
<title>GitHub markdown table must not expand nested flex boxes into the sidebar</title>
<link rel="match" href="support/table-flex-github-ref.htm">
<style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px sans-serif; line-height: 1.5; overflow-wrap: break-word; }
    .layout { display: flex; width: 1000px; gap: 24px; }
    .content { flex: 1 1 0; min-width: 1px; display: flex; flex-direction: column; }
    .content-box { flex: 1; padding: 16px; }
    .Box_11 { display: flex; flex-direction: column; min-width: 0; gap: 16px; }
    .Box_1 { display: flex; flex: 1; gap: 16px; }
    .Box_2 { display: flex; flex-direction: column; flex: 1; max-width: 100%; border: 1px solid; background: orange; }
    .SharedMarkdownContent { overflow: auto; padding: 32px; }
    article { max-width: 1012px; margin: 0 auto; }
    markdown-accessiblity-table { display: block; }
    table { display: block; width: max-content; max-width: 100%; overflow: auto; scrollbar-width: none; border-collapse: collapse; }
    td { padding: 6px 13px; border: 1px solid black; }
    code { font: 85% monospace; padding: 2px 5px; white-space: break-spaces; }
    .sidebar { flex: 0 0 256px; padding: 16px; }
    .about { background: tomato; }
    h2 { margin: 0 0 16px; font-size: 16px; }
    p { margin: 0; }
</style>
<div class="layout">
    <div class="content"><div class="content-box"><div class="Box_11"><div class="Box_1"><div class="Box_2">
        <div class="SharedMarkdownContent"><article><markdown-accessiblity-table>
            <table><tbody><tr>
                <td><code>LITEHTML_BUILD_CONTAINER_CAIRO</code></td>
                <td><code>litehtml_container_cairo</code>: Cairo reference container, without text drawing</td>
                <td>Cairo</td>
            </tr></tbody></table>
        </markdown-accessiblity-table></article></div>
    </div></div></div></div></div>
    <div class="sidebar"><div class="about">
        <h2>About</h2>
        <p>Fast and lightweight HTML/CSS rendering engine</p>
    </div></div>
</div>
