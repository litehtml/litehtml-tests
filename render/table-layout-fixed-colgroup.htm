<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>table-layout: fixed - column-group width is ignored</title>
<style>
html, body { margin: 0; padding: 0; }
table { table-layout: fixed; width: 200px; border-collapse: collapse; }
td { padding: 0; border: 0; font-size: 0; line-height: 0; }
.fill { height: 20px; }
.red { background: #d00; }
.blue { background: #00d; }
.ref { height: 10px; margin-top: 10px; font-size: 0; }
.ref div { display: inline-block; height: 10px; vertical-align: top; }
</style>
</head>
<body>
<table>
<colgroup style="width: 50px"><col></colgroup>
<colgroup><col></colgroup>
<tr><td style="width: 100px"><div class="fill red"></div></td><td><div class="fill blue"></div></td></tr>
</table>
<div class="ref"><div class="red" style="width: 100px"></div><div class="blue" style="width: 100px"></div></div>
</body>
</html>
