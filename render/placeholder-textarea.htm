<!doctype html>
<style>
body {
	margin: 30px;
	font: 16px serif;
}

div {
	margin-bottom: 8px;
}

textarea {
	width: 240px;
	height: 72px;
}
</style>

<!-- Textarea placeholders use the UA colour and wrap like normal content. -->
<div><textarea placeholder="A long textarea placeholder that wraps onto several lines"></textarea></div>

<!-- A non-empty textarea hides its placeholder. -->
<div><textarea placeholder="hidden by content">typed content</textarea></div>
