<!doctype html>
<style>
body {
	margin: 20px;
	font: 12px serif;
}

div {
	display: inline-block;
	width: 60px;
	height: 40px;
	background: #ddd;
	margin: 12px;
}

.dotted  { outline: 5px dotted red; }
.dashed  { outline: 5px dashed red; }
.solid   { outline: 5px solid red; }
.double  { outline: 5px double red; }
.groove  { outline: 5px groove red; }
.ridge   { outline: 5px ridge red; }
.inset   { outline: 5px inset red; }
.outset  { outline: 5px outset red; }
</style>

<!-- All outline-style values must render distinctly. -->
<div class="dotted">dotted</div><div class="dashed">dashed</div><div class="solid">solid</div><div class="double">double</div><div class="groove">groove</div><div class="ridge">ridge</div><div class="inset">inset</div><div class="outset">outset</div>
