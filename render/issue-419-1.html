<!DOCTYPE html>
<head>
    <style>
        .flexbox {
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            width: 500px;
            background-color: blue;
        }
        .item1 {
            flex-grow: 10;
            width: 10px;
            max-width: 15px;
            background-color: red;
        }
        .item2 {
            flex-grow: 1;
            width: 10px;
            background-color: green;
        }
    </style>
</head>
<html>
    <div class="flexbox">
        <span class="item1"></span>
        <span class="item2">hello</span>
        <span class="item2">world</span>
    </div>
</html>
