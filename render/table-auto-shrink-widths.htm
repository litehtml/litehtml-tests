<!doctype html>
<title>Automatic tables shrink pixel cell widths, with and without a spanning header</title>
<link rel="match" href="support/table-auto-shrink-widths-ref.htm">

    body { margin: 8px; background: #fff; }
    .page { width: 600px; background: #eee; margin-bottom: 20px; }
    table { width: 900px; max-width: 100%; border-spacing: 0; }
    td { padding: 0; height: 20px; width: 50px; }
    .h { width: auto; background: #888; }

</table></div>

</table></div>
