<!doctype html>
<meta charset="utf-8">
<title>Absolute and fixed flex children retain containing blocks and static alignment</title>
<link rel="match" href="support/out-of-flow-position-ref.htm">
<style>
    body { margin: 0; }
    .box { position: absolute; display: flex; width: 100px; height: 60px; background: orange; }
    .child { position: absolute; width: 20px; height: 20px; background: green; }
    #start { left: 10px; top: 10px; }
    #center { left: 130px; top: 10px; justify-content: center; align-items: center; }
    .in-flow { width: 80px; height: 10px; background: blue; }
    #center-gap { left: 250px; top: 10px; justify-content: center; align-items: center; gap: 10px; }
    #insets { left: 370px; top: 10px; }
    #insets .child { left: 10px; right: 10px; top: 10px; bottom: 10px; width: auto; height: auto; }
    #percentage { left: 490px; top: 10px; }
    #percentage .child { left: 0; top: 0; width: 100%; height: 100%; }
    #ancestor { position: absolute; left: 10px; top: 100px; width: 100px; height: 60px; background: orange; }
    #ancestor .flex { display: flex; }
    #ancestor .child { left: 0; top: 0; width: 100%; height: 100%; }
    #fixed { left: 130px; top: 100px; }
    #fixed .child { position: fixed; left: 750px; top: 0; width: 20px; height: 100%; }
</style>
<div class="box" id="start"><div class="child"></div></div>
<div class="box" id="center"><div class="child"></div><div class="in-flow"></div></div>
<div class="box" id="center-gap"><div class="child"></div></div>
<div class="box" id="insets"><div class="child"></div></div>
<div class="box" id="percentage"><div class="child"></div></div>
<div id="ancestor"><div class="flex"><div class="child"></div></div></div>
<div class="box" id="fixed"><div class="child"></div></div>
