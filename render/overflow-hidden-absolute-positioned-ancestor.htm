<!DOCTYPE html>
<html>
 <head>
  <meta charset="utf-8">
  <title>Absolute child of a positioned overflow:hidden box is clipped by it</title>
  <style>
   html, body { margin: 0; padding: 0; border: 0; }
   .overflow { position: relative; width: 100px; height: 100px; background: #ff9800; overflow: hidden; }
   .abs { position: absolute; left: 50px; top: 50px; width: 100px; height: 100px; background: #e53935; }
  </style>
 </head>
 <body>
  <div class="overflow"><div class="abs"></div></div>
 </body>
</html>
