<!DOCTYPE html>
<html>
 <head>
  <meta charset="utf-8">
  <title>Relative in-flow child of overflow:hidden is clipped</title>
  <style>
   html, body { margin: 0; padding: 0; border: 0; }
   .overflow { width: 100px; height: 100px; background: #ff9800; overflow: hidden; }
   .rel { position: relative; left: 150px; top: 0; width: 100px; height: 100px; background: #43a047; }
  </style>
 </head>
 <body>
  <div class="overflow"><div class="rel"></div></div>
 </body>
</html>
