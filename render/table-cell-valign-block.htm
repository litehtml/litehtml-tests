<html>
<head>
<style>
td { border: 1px solid black; width: 100px; }
.tall { height: 100px; background: #ccc; }
.box { background: #08f; height: 20px; }
.margin { margin: 10px 0; }
</style>
</head>
<body>
<table>
<tr>
  <td><div class="tall"></div></td>
  <td valign="bottom"><div class="box"></div></td>
  <td valign="middle"><div class="box"></div></td>
  <td valign="top"><div class="box"></div></td>
  <td><div class="box"></div></td>
  <td style="vertical-align: bottom"><div class="box margin"></div><div class="box"></div></td>
  <td valign="middle"><div class="box"></div><div class="box"></div><div class="box"></div></td>
  <td valign="bottom"><div class="box" style="float: right; width: 30px"></div><div class="box"></div></td>
</tr>
</table>
</body>
</html>
