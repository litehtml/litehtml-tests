<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>calc() in box dimensions</title>
    <style>
        @font-face { font-family: Ahem; src: url(../../fonts/ahem.ttf); }
        html { font-size: 10px; }
        body { margin: 0; font: 10px/10px Ahem; }
        .outer { width: 400px; background: #ddd; }
        .a { width: calc(50% - 20px); height: calc(10px + 2 * 5px); background: #3a6; }
        .b { width: calc(100% - 4em); height: 20px; margin-left: calc(2rem + 1%); background: #36c; }
        .c { width: calc(25% + 0px); padding: calc(5px + 1%) calc(2em - 10px); background: #da3; }
        .c div { height: 10px; background: #a4a; }
        .d { width: 100px; height: 20px; border: calc(1px + 2px) solid #36c; margin: calc(-5px + 10px) 0 calc(20px / 2); }
        .e { min-width: calc(50% + 10px); width: 10px; height: 10px; background: #3a6; }
        .f { max-width: calc(30% - 20px); height: 10px; background: #a4a; }
        .g { min-height: calc(10px * 3); width: 50px; background: #da3; }
        .h { width: 200px; height: 20px; padding-left: calc(-20px); background: #36c; }
    </style>
</head>
<body>
    <div class="outer">
        <div class="a"></div>
        <div class="b"></div>
        <div class="c"><div></div></div>
        <div class="d"></div>
        <div class="e"></div>
        <div class="f"></div>
        <div class="g"></div>
        <div class="h"></div>
    </div>
</body>
</html>
