<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Reference for invalid math functions are ignored</title>
    <style>
        body { margin: 0; }
        .box { width: 300px; background: #ddd; }
        .box div { width: 100px; height: 10px; margin-bottom: 5px; background: #3a6; }
        .neg { width: 200px; padding-left: 0; border-left: 0 solid #a4a; }
        .neg-height { height: 0 !important; min-height: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <div class="a"></div><div class="b"></div><div class="c"></div><div class="d"></div>
        <div class="e"></div><div class="f"></div><div class="g"></div><div class="h"></div>
        <div class="i"></div><div class="j"></div><div class="k"></div><div class="l"></div>
        <div class="neg"></div><div class="neg-height"></div>
    </div>
</body>
</html>
