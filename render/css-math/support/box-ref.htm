<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Reference for calc() in box dimensions</title>
    <style>
        @font-face { font-family: Ahem; src: url(../../../fonts/ahem.ttf); }
        html { font-size: 10px; }
        body { margin: 0; font: 10px/10px Ahem; }
        .outer { width: 400px; background: #ddd; }
        .a { width: 180px; height: 20px; background: #3a6; }
        .b { width: 360px; height: 20px; margin-left: 24px; background: #36c; }
        .c { width: 100px; padding: 9px 10px; background: #da3; }
        .c div { height: 10px; background: #a4a; }
        .d { width: 100px; height: 20px; border: 3px solid #36c; margin: 5px 0 10px; }
        .e { width: 210px; height: 10px; background: #3a6; }
        .f { max-width: 100px; height: 10px; background: #a4a; }
        .g { min-height: 30px; width: 50px; background: #da3; }
        .h { width: 200px; height: 20px; padding-left: 0; background: #36c; }
    </style>
</head>
<body>
    <div class="outer">
        <div class="a"></div>
        <div class="b"></div>
        <div class="c"><div></div></div>
        <div class="d"></div>
        <div class="e"></div>
        <div class="f"></div>
        <div class="g"></div>
        <div class="h"></div>
    </div>
</body>
</html>
