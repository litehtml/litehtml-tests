<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Reference for var() inside math functions</title>
    <style>
        body { margin: 0; }
        .box { width: 300px; background: #ddd; }
        .box div { height: 10px; margin-bottom: 5px; }
        .a { width: 140px; background: #3a6; }
        .b { width: 50px; background: #36c; }
        .c { width: 60px; background: #da3; }
        .d { width: 40px; background: #a4a; }
        .e { width: 160px; background: #3a6; }
        .f { width: 40px; background: #36c; }
        .g { width: 11px; background: #da3; }
        .h { margin: 0 20px 5px; height: 10px; background: #a4a; }
    </style>
</head>
<body>
    <div class="box"><div class="a"></div><div class="b"></div><div class="c"></div><div class="d"></div><div class="e"></div><div class="f"></div><div class="g"></div><div class="h"></div></div>
</body>
</html>
