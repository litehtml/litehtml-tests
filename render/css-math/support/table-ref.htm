<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Reference for calc() in table layout</title>
    <style>
        body { margin: 0; }
        table { width: 400px; border-collapse: separate; border-spacing: 10px 5px; background: #ddd; margin-bottom: 10px; }
        td { padding: 2px 0; background: #3a6; }
        td div { height: 20px; }
        td.w { width: 100px; background: #36c; }
        td.m { width: 60px; background: #da3; }
        .fixed { table-layout: fixed; width: 300px; }
        .fixed td:first-child { width: 100px; background: #a4a; }
    </style>
</head>
<body>
    <table><tr><td class="w"><div></div></td><td class="m"><div></div></td><td><div></div></td></tr></table>
    <table class="fixed"><tr><td><div></div></td><td><div></div></td></tr></table>
</body>
</html>
