<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Reference for calc() in font-size and line-height</title>
    <style>
        @font-face { font-family: Ahem; src: url(../../../fonts/ahem.ttf); }
        html { font-size: 10px; }
        body { margin: 0; font-family: Ahem; font-size: 10px; line-height: 1; }
        div { color: #3a6; }
        .a { font-size: 20px; line-height: 30px; }
        .b { font-size: 10px; line-height: 30px; color: #36c; }
        .c { font-size: 20px; line-height: 2; color: #da3; }
        .c div { font-size: 10px; color: #36c; }
        .d { font-size: 20px; line-height: 30px; color: #a4a; }
        .d div { font-size: 10px; color: #3a6; }
        .e { font-size: 20px; line-height: 40px; color: #36c; }
    </style>
</head>
<body>
    <div class="a">XX X</div>
    <div class="b">XX X</div>
    <div class="c">X<div>XX</div></div>
    <div class="d">X<div>XX</div></div>
    <div class="e">XXX</div>
</body>
</html>
