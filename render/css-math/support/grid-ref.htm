<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Reference for calc() in grid layout</title>
    <style>
        body { margin: 0; }
        .grid { display: grid; width: 300px; margin-bottom: 10px; background: #ddd; }
        .grid div { height: 20px; background: #3a6; }
        .grid div:nth-child(2n) { background: #36c; }
        .tracks { grid-template-columns: 140px 1fr; column-gap: 20px; }
        .repeat { grid-template-columns: repeat(auto-fill, 60px); gap: 10px; }
        .minmax { grid-template-columns: 80px 1fr; grid-template-rows: 30px 15px; row-gap: 10px; }
        .minmax div { height: auto; }
    </style>
</head>
<body>
    <div class="grid tracks"><div></div><div></div></div>
    <div class="grid repeat"><div></div><div></div><div></div><div></div><div></div><div></div></div>
    <div class="grid minmax"><div></div><div></div><div></div><div></div></div>
</body>
</html>
