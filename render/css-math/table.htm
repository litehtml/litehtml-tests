<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>calc() in table layout</title>
    <style>
        body { margin: 0; }
        table { width: calc(200px * 2); border-collapse: separate; border-spacing: calc(2px * 5) 5px; background: #ddd; margin-bottom: 10px; }
        td { padding: calc(1px + 1px) 0; background: #3a6; }
        td div { height: calc(10px + 10px); }
        td.w { width: calc(20px * 5); background: #36c; }
        td.m { width: max(30px, 60px); background: #da3; }
        .fixed { table-layout: fixed; width: 300px; }
        .fixed td:first-child { width: min(150px, calc(10px * 10)); background: #a4a; }
    </style>
</head>
<body>
    <table><tr><td class="w"><div></div></td><td class="m"><div></div></td><td><div></div></td></tr></table>
    <table class="fixed"><tr><td><div></div></td><td><div></div></td></tr></table>
</body>
</html>
