<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Grid auto-repeat named lines</title>
    <style>
        body {
            margin: 0;
            width: 200px;
        }

        .page {
            height: 20px;
        }

        .grid {
            display: grid;
            width: 200px;
            height: 20px;
            background: #eee;
            grid-template-columns: repeat(auto-fill, [col] minmax(40px, 1fr));
        }

        .p1 {
            grid-column: col 1 / span 1;
        }

        .p2 {
            grid-column: col 3;
        }

        .p3 {
            grid-column: col 5 / span 1;
        }

        .a {
            background: #d33;
        }

        .b {
            background: #3a6;
        }

        .c {
            background: #36c;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="grid">
            <div class="a p1"></div>
            <div class="b p2"></div>
            <div class="c p3"></div>
        </div>
    </div>
</body>

</html>
