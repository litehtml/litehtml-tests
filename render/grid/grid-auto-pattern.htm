<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Grid repeating implicit track patterns</title>
    <style>
        body {
            margin: 0;
            width: 220px;
        }

        .page {
            height: 280px;
        }

        .grid {
            display: grid;
        }

        .rows {
            width: 100px;
            margin-bottom: 20px;
            grid-template-columns: 100px;
            grid-template-rows: 20px 20px;
            grid-auto-rows: 10px 30px 50px;
        }

        .columns {
            height: 40px;
            grid-template-columns: 40px;
            grid-template-rows: 40px;
            grid-auto-columns: 20px 60px;
            grid-auto-flow: column;
            justify-content: start;
        }

        .a {
            background: #d33;
        }

        .b {
            background: #3a6;
        }

        .c {
            background: #36c;
        }

        .d {
            background: #da3;
        }

        .e {
            background: #a4a;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="grid rows">
            <div class="a"></div>
            <div class="b"></div>
            <div class="c"></div>
            <div class="d"></div>
            <div class="e"></div>
            <div class="a"></div>
            <div class="b"></div>
            <div class="c"></div>
        </div>
        <div class="grid columns">
            <div class="a"></div>
            <div class="b"></div>
            <div class="c"></div>
            <div class="d"></div>
            <div class="e"></div>
        </div>
    </div>
</body>

</html>
