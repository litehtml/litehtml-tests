<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Reference for Grid item alignment values</title>
    <style>
        body {
            margin: 0;
            width: 300px;
        }

        .page {
            position: relative;
            height: 290px;
            width: 300px;
        }

        .box {
            position: absolute;
            background: #d33;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="box" style="left:0;top:0;width:20px;height:10px"></div>
        <div class="box" style="left:40px;top:65px;width:20px;height:10px"></div>
        <div class="box" style="left:80px;top:130px;width:20px;height:10px"></div>
        <div class="box" style="left:0;top:150px;width:20px;height:10px"></div>
        <div class="box" style="left:0;top:200px;width:100px;height:40px"></div>
        <div class="box" style="left:0;top:250px;width:100px;height:40px"></div>
    </div>
</body>

</html>
