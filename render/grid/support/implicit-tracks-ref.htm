<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Reference for implicit Grid tracks</title>
    <style>
        body {
            margin: 0;
            width: 290px;
        }

        .page {
            position: relative;
            width: 290px;
            height: 90px;
        }

        .box {
            position: absolute;
        }

        .a {
            background: #d33;
        }

        .b {
            background: #3a6;
        }

        .c {
            background: #36c;
        }

        .d {
            background: #da3;
        }

        .e {
            background: #a4a;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="box a" style="left:0;top:0;width:30px;height:20px"></div>
        <div class="box b" style="left:30px;top:0;width:100px;height:20px"></div>
        <div class="box c" style="left:130px;top:0;width:100px;height:20px"></div>
        <div class="box d" style="left:260px;top:0;width:30px;height:20px"></div>
        <div class="box e" style="left:30px;top:35px;width:100px;height:15px"></div>
        <div class="box a" style="left:0;top:70px;width:70px;height:20px"></div>
        <div class="box b" style="left:70px;top:70px;width:70px;height:20px"></div>
        <div class="box c" style="left:140px;top:70px;width:70px;height:20px"></div>
    </div>
</body>

</html>
