<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Reference for Grid sizing bounds</title>
    <style>
        body {
            margin: 0;
            width: 300px;
        }

        .page {
            position: relative;
            width: 300px;
            height: 100px;
        }

        .box {
            position: absolute;
            height: 20px;
        }

        .a {
            background: #d33;
        }

        .b {
            background: #3a6;
        }

        .c {
            background: #36c;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="box a" style="left:0;top:0;width:100px"></div>
        <div class="box b" style="left:100px;top:0;width:200px"></div>
        <div class="box a" style="left:0;top:30px;width:40px"></div>
        <div class="box b" style="left:40px;top:30px;width:260px"></div>
        <div class="box a" style="left:0;top:60px;width:200px"></div>
        <div class="box b" style="left:0;top:80px;width:50px"></div>
        <div class="box c" style="left:50px;top:80px;width:150px"></div>
    </div>
</body>

</html>
