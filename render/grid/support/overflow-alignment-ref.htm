<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Reference for Grid alignment overflow</title>
    <style>
        body {
            margin: 0;
            width: 210px;
        }

        .page {
            position: relative;
            width: 210px;
            height: 50px;
        }

        .box {
            position: absolute;
            width: 80px;
            height: 20px;
        }

        .a {
            background: #d33;
        }

        .b {
            background: #3a6;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="box a" style="left:50px;top:0"></div>
        <div class="box b" style="left:130px;top:0"></div>
        <div class="box a" style="left:50px;top:30px"></div>
        <div class="box b" style="left:130px;top:30px"></div>
    </div>
</body>

</html>
