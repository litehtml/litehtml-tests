<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Reference for Grid line placement</title>
    <style>
        body {
            margin: 0;
            width: 200px;
        }

        .page {
            position: relative;
            width: 200px;
            height: 60px;
        }

        .box {
            position: absolute;
        }

        .a {
            background: #d33;
        }

        .b {
            background: #3a6;
        }

        .c {
            background: #36c;
        }

        .d {
            background: #da3;
        }

        .e {
            background: #a4a;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="box a" style="left:50px;top:20px;width:100px;height:40px"></div>
        <div class="box b" style="left:150px;top:0;width:50px;height:20px"></div>
        <div class="box c" style="left:0;top:0;width:100px;height:20px"></div>
        <div class="box d" style="left:100px;top:0;width:50px;height:20px"></div>
        <div class="box e" style="left:0;top:40px;width:50px;height:20px"></div>
    </div>
</body>

</html>
