<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Reference for Grid content alignment</title>
    <style>
        body {
            margin: 0;
            width: 300px;
        }

        .page {
            position: relative;
            width: 300px;
            height: 460px;
        }

        .box {
            position: absolute;
            width: 60px;
            height: 12px;
        }

        .a {
            background: #d33;
        }

        .b {
            background: #3a6;
        }

        .c {
            background: #36c;
        }

        .d {
            background: #da3;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="box a" style="left:0;top:0"></div>
        <div class="box b" style="left:60px;top:0"></div>
        <div class="box c" style="left:0;top:12px"></div>
        <div class="box d" style="left:60px;top:12px"></div>
        <div class="box a" style="left:180px;top:116px"></div>
        <div class="box b" style="left:240px;top:116px"></div>
        <div class="box c" style="left:180px;top:128px"></div>
        <div class="box d" style="left:240px;top:128px"></div>
        <div class="box a" style="left:90px;top:178px"></div>
        <div class="box b" style="left:150px;top:178px"></div>
        <div class="box c" style="left:90px;top:190px"></div>
        <div class="box d" style="left:150px;top:190px"></div>
        <div class="box a" style="left:0;top:240px"></div>
        <div class="box b" style="left:240px;top:240px"></div>
        <div class="box c" style="left:0;top:288px"></div>
        <div class="box d" style="left:240px;top:288px"></div>
        <div class="box a" style="left:45px;top:329px"></div>
        <div class="box b" style="left:195px;top:329px"></div>
        <div class="box c" style="left:45px;top:359px"></div>
        <div class="box d" style="left:195px;top:359px"></div>
        <div class="box a" style="left:60px;top:412px"></div>
        <div class="box b" style="left:180px;top:412px"></div>
        <div class="box c" style="left:60px;top:436px"></div>
        <div class="box d" style="left:180px;top:436px"></div>
    </div>
</body>

</html>
