<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Reference for subgrid rows, names and gaps</title>
    <style>
        body {
            margin: 0;
            width: 230px;
        }

        .page {
            position: relative;
            width: 230px;
            height: 90px;
        }

        .box {
            position: absolute;
        }

        .short {
            left: 0;
            top: 0;
            width: 100px;
            height: 20px;
            background: #d33;
        }

        .tall {
            left: 0;
            top: 30px;
            width: 100px;
            height: 30px;
            background: #3a6;
        }

        .first {
            left: 50px;
            top: 70px;
            width: 75px;
            height: 20px;
            background: #36c;
        }

        .second {
            left: 125px;
            top: 70px;
            width: 105px;
            height: 20px;
            background: #da3;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="box short"></div>
        <div class="box tall"></div>
        <div class="box first"></div>
        <div class="box second"></div>
    </div>
</body>

</html>
