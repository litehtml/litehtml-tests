<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Reference for Grid at different widths</title>
    <style>
        body {
            margin: 0;
            width: 620px;
        }

        .page {
            position: relative;
            width: 620px;
            height: 70px;
        }

        .box {
            position: absolute;
        }

        .a {
            background: #d33;
        }

        .b {
            background: #3a6;
        }

        .c {
            background: #a4a;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="box a" style="left:0;top:0;width:100px;height:20px"></div>
        <div class="box b" style="left:120px;top:0;width:200px;height:20px"></div>
        <div class="box a" style="left:0;top:30px;width:200px;height:20px"></div>
        <div class="box b" style="left:220px;top:30px;width:400px;height:20px"></div>
        <div class="box c" style="left:0;top:60px;width:620px;height:10px"></div>
    </div>
</body>

</html>
