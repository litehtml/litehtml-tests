<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Reference for Grid track sizes</title>
    <style>
        body {
            margin: 0;
            width: 300px;
        }

        .page {
            position: relative;
            width: 300px;
            height: 110px;
        }

        .box {
            position: absolute;
            height: 20px;
        }

        .a {
            background: #d33;
        }

        .b {
            background: #3a6;
        }

        .c {
            background: #36c;
        }

        .d {
            background: #da3;
        }

        .e {
            background: #a4a;
        }

        .r1 {
            top: 0;
        }

        .r2 {
            top: 30px;
        }

        .r3 {
            top: 60px;
        }

        .r4 {
            top: 90px;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="box a r1" style="left:0;width:75px"></div>
        <div class="box b r1" style="left:75px;width:75px"></div>
        <div class="box c r1" style="left:150px;width:150px"></div>
        <div class="box a r2" style="left:0;width:40px"></div>
        <div class="box b r2" style="left:40px;width:20px"></div>
        <div class="box c r2" style="left:60px;width:40px"></div>
        <div class="box d r2" style="left:100px;width:20px"></div>
        <div class="box e r2" style="left:120px;width:180px"></div>
        <div class="box a r3" style="left:0;width:100px"></div>
        <div class="box b r3" style="left:100px;width:200px"></div>
        <div class="box a r4" style="left:0;width:75px"></div>
        <div class="box b r4" style="left:75px;width:75px"></div>
    </div>
</body>

</html>
