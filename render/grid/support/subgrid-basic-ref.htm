<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Reference for inherited subgrid tracks</title>
    <style>
        body {
            margin: 0;
            width: 230px;
        }

        .page {
            position: relative;
            width: 230px;
            height: 60px;
        }

        .box {
            position: absolute;
        }

        .a {
            background: #d33;
        }

        .b {
            background: #3a6;
        }

        .c {
            background: #36c;
        }

        .d {
            background: #da3;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="box a" style="left:50px;top:0;width:70px;height:20px"></div>
        <div class="box b" style="left:130px;top:0;width:100px;height:20px"></div>
        <div class="box c" style="left:50px;top:30px;width:70px;height:30px"></div>
        <div class="box d" style="left:130px;top:30px;width:100px;height:30px"></div>
    </div>
</body>

</html>
