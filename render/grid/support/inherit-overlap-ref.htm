<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Reference for inherited Grid tracks and overlap</title>
    <style>
        body {
            margin: 0;
            width: 200px;
        }

        .page {
            position: relative;
            width: 200px;
            height: 80px;
        }

        .box {
            position: absolute;
        }

        .a {
            background: #d33;
        }

        .b {
            background: #3a6;
        }

        .c {
            background: #36c;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="box a" style="left:0;top:0;width:90px;height:20px"></div>
        <div class="box b" style="left:90px;top:0;width:110px;height:20px"></div>
        <div class="box a" style="left:0;top:40px;width:100px;height:40px"></div>
        <div class="box b" style="left:25px;top:50px;width:50px;height:20px"></div>
        <div class="box c" style="left:100px;top:40px;width:100px;height:40px"></div>
    </div>
</body>

</html>
