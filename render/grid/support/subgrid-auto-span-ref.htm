<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Reference for automatic subgrid span</title>
    <style>
        body {
            margin: 0;
            width: 120px;
        }

        .page {
            position: relative;
            width: 120px;
            height: 20px;
        }

        .box {
            position: absolute;
            top: 0;
            width: 30px;
            height: 20px;
        }

        .first {
            left: 0;
            background: #d33;
        }

        .second {
            left: 30px;
            background: #3a6;
        }

        .third {
            left: 60px;
            background: #36c;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="box first"></div>
        <div class="box second"></div>
        <div class="box third"></div>
    </div>
</body>

</html>
