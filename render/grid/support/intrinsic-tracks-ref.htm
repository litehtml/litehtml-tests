<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Reference for intrinsic Grid tracks</title>
    <style>
        body {
            margin: 0;
            width: 300px;
        }

        .page {
            position: relative;
            width: 300px;
            height: 190px;
        }

        .box {
            position: absolute;
        }

        .a {
            background: #d33;
        }

        .b {
            background: #3a6;
        }

        .c {
            background: #36c;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="box a" style="left:0;top:0;width:40px;height:20px"></div>
        <div class="box b" style="left:40px;top:0;width:90px;height:20px"></div>
        <div class="box c" style="left:130px;top:0;width:170px;height:20px"></div>
        <div class="box a" style="left:0;top:30px;width:72px;height:20px"></div>
        <div class="box b" style="left:72px;top:30px;width:228px;height:20px"></div>
        <div class="box a" style="left:0;top:60px;width:20px;height:20px"></div>
        <div class="box b" style="left:20px;top:60px;width:30px;height:20px"></div>
        <div class="box c" style="left:50px;top:60px;width:250px;height:20px"></div>
        <div class="box a" style="left:0;top:90px;width:300px;height:100px"></div>
    </div>
</body>

</html>
