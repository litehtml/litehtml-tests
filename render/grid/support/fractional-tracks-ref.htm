<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Reference for fixed and fractional grid columns</title>
    <style>
        body {
            margin: 0;
            width: 300px;
        }

        .reference {
            position: relative;
            width: 300px;
            height: 50px;
        }

        .reference div {
            position: absolute;
            height: 20px;
        }

        .a {
            left: 0;
            top: 0;
            width: 100px;
            background: #d33;
        }

        .b {
            left: 110px;
            top: 0;
            width: 60px;
            background: #3a6;
        }

        .c {
            left: 180px;
            top: 0;
            width: 120px;
            background: #36c;
        }

        .d {
            left: 0;
            top: 30px;
            width: 100px;
            background: #da3;
        }
    </style>
</head>

<body>
    <div class="reference">
        <div class="a"></div>
        <div class="b"></div>
        <div class="c"></div>
        <div class="d"></div>
    </div>
</body>

</html>
