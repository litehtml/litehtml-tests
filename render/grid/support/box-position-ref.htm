<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Reference for Grid item box sizing and positioning</title>
    <style>
        body {
            margin: 0;
            width: 207px;
        }

        .page {
            position: relative;
            width: 207px;
            height: 130px;
        }

        .first {
            position: absolute;
            left: 10px;
            top: 10px;
            width: 40px;
            height: 20px;
            padding: 5px;
            border: 5px solid #222;
            background: #d33;
        }

        .second {
            position: absolute;
            left: 187px;
            top: 70px;
            width: 20px;
            height: 15px;
            background: #36c;
        }

        .absolute {
            position: absolute;
            left: 4px;
            top: 4px;
            width: 8px;
            height: 8px;
            background: #da3;
        }

        img {
            position: absolute;
            left: 42px;
            top: 107px;
        }

        .fill {
            position: absolute;
            left: 100px;
            top: 100px;
            width: 100px;
            height: 30px;
            background: #3a6;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="first"></div>
        <div class="second"></div>
        <div class="absolute"></div>
        <img src="../../green16.png">
        <div class="fill"></div>
    </div>
</body>

</html>
