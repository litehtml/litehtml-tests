<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Reference for subgrid intrinsic column sizing</title>
    <style>
        body {
            margin: 0;
            width: 300px;
        }

        .page {
            position: relative;
            width: 300px;
            height: 20px;
        }

        .box {
            position: absolute;
            top: 0;
            height: 20px;
        }

        .first {
            left: 0;
            width: 40px;
            background: #d33;
        }

        .second {
            left: 50px;
            width: 100px;
            background: #3a6;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="box first"></div>
        <div class="box second"></div>
    </div>
</body>

</html>
