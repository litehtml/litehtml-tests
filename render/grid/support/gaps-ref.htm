<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Reference for Grid gaps</title>
    <style>
        body {
            margin: 0;
            width: 300px;
        }

        .page {
            position: relative;
            width: 300px;
            height: 265px;
        }

        .box {
            position: absolute;
        }

        .a {
            background: #d33;
        }

        .b {
            background: #3a6;
        }

        .c {
            background: #36c;
        }

        .d {
            background: #da3;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="box a" style="left:0;top:0;width:90px;height:20px"></div>
        <div class="box b" style="left:120px;top:0;width:90px;height:20px"></div>
        <div class="box c" style="left:0;top:30px;width:90px;height:20px"></div>
        <div class="box d" style="left:120px;top:30px;width:90px;height:20px"></div>
        <div class="box a" style="left:0;top:120px;width:300px;height:40px"></div>
        <div class="box b" style="left:0;top:168px;width:300px;height:40px"></div>
        <div class="box a" style="left:0;top:220px;width:100px;height:20px"></div>
        <div class="box b" style="left:115px;top:220px;width:185px;height:20px"></div>
        <div class="box c" style="left:0;top:245px;width:100px;height:20px"></div>
        <div class="box d" style="left:115px;top:245px;width:185px;height:20px"></div>
    </div>
</body>

</html>
