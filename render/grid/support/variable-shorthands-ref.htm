<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Reference for Grid custom properties</title>
    <style>
        body {
            margin: 0;
            width: 200px;
        }

        .page {
            position: relative;
            width: 200px;
            height: 40px;
        }

        .box {
            position: absolute;
            height: 15px;
        }

        .a {
            background: #d33;
        }

        .b {
            background: #3a6;
        }

        .c {
            background: #36c;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="box a" style="left:90px;top:0;width:110px"></div>
        <div class="box b" style="left:0;top:0;width:80px"></div>
        <div class="box c" style="left:0;top:25px;width:80px"></div>
    </div>
</body>

</html>
