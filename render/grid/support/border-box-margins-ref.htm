<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Reference for Grid border-box and auto margins</title>
    <style>
        body {
            margin: 0;
            width: 200px;
        }

        .page {
            position: relative;
            width: 200px;
            height: 60px;
        }

        .item {
            position: absolute;
            left: 60px;
            top: 10px;
            box-sizing: border-box;
            width: 80px;
            height: 40px;
            padding: 10px;
            border: 5px solid #222;
            background: #d33;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="item"></div>
    </div>
</body>

</html>
