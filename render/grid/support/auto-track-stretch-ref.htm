<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Reference for Grid auto track stretching</title>
    <style>
        body {
            margin: 0;
            width: 300px;
        }

        .page {
            position: relative;
            width: 300px;
            height: 150px;
        }

        .box {
            position: absolute;
        }

        .a {
            background: #d33;
        }

        .b {
            background: #3a6;
        }

        .c {
            background: #36c;
        }

        .d {
            background: #da3;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="box a" style="left:0;top:0;width:100px;height:50px"></div>
        <div class="box b" style="left:100px;top:0;width:100px;height:50px"></div>
        <div class="box c" style="left:0;top:50px;width:100px;height:50px"></div>
        <div class="box d" style="left:100px;top:50px;width:100px;height:50px"></div>
        <div class="box a" style="left:0;top:110px;width:150px;height:20px"></div>
        <div class="box b" style="left:0;top:130px;width:150px;height:20px"></div>
        <div class="box c" style="left:150px;top:110px;width:150px;height:20px"></div>
        <div class="box d" style="left:150px;top:130px;width:150px;height:20px"></div>
    </div>
</body>

</html>
