<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Grid auto-fill vs auto-fit with minmax</title>
    <style>
        body {
            margin: 0;
            width: 200px;
        }

        .page {
            height: 50px;
        }

        .grid {
            display: grid;
            width: 200px;
            height: 20px;
            margin-bottom: 10px;
            background: #eee;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
        }

        .fit {
            grid-template-columns: repeat(auto-fit, minmax(40px, 1fr));
        }

        .grid:last-child {
            margin-bottom: 0;
        }

        .a {
            background: #d33;
        }

        .b {
            background: #3a6;
        }

        .c {
            background: #36c;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="grid">
            <div class="a"></div>
            <div class="b"></div>
            <div class="c"></div>
        </div>
        <div class="grid fit">
            <div class="a"></div>
            <div class="b"></div>
            <div class="c"></div>
        </div>
    </div>
</body>

</html>
