<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Grid placement, spans, order and flow</title>
    <style>
        body {
            margin: 0;
            width: 300px;
        }

        .page {
            height: 120px;
        }

        .grid {
            display: grid;
            width: 300px;
        }

        .rows {
            height: 60px;
            margin-bottom: 20px;
            grid-template-columns: repeat(3, 100px);
            grid-auto-rows: 20px;
        }

        .rows .a {
            grid-column: 2;
            grid-row: 1;
        }

        .rows .b {
            grid-column: span 2;
        }

        .rows .d {
            grid-column: -4 / -3;
            grid-row: 3;
        }

        .columns {
            height: 40px;
            grid-template-rows: repeat(2, 20px);
            grid-auto-columns: 60px;
            grid-auto-flow: column;
            justify-content: start;
        }

        .columns .b {
            order: -1;
        }

        .columns .d {
            grid-row: 2;
            grid-column: 2;
        }

        .a {
            background: #d33;
        }

        .b {
            background: #3a6;
        }

        .c {
            background: #36c;
        }

        .d {
            background: #da3;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="grid rows">
            <div class="a"></div>
            <div class="b"></div>
            <div class="c"></div>
            <div class="d"></div>
        </div>
        <div class="grid columns">
            <div class="a"></div>
            <div class="b"></div>
            <div class="c"></div>
            <div class="d"></div>
        </div>
    </div>
</body>

</html>
