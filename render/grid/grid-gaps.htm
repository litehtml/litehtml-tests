<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Grid length and percentage gaps</title>
    <style>
        body {
            margin: 0;
            width: 300px;
        }

        .page {
            height: 265px;
        }

        .grid {
            display: grid;
            width: 300px;
        }

        .definite {
            height: 100px;
            margin-bottom: 20px;
            grid-template-columns: 90px 90px;
            grid-template-rows: 20px 20px;
            column-gap: 10%;
            row-gap: 10%;
        }

        .cyclic {
            margin-bottom: 20px;
            grid-template-rows: 40px 40px;
            row-gap: 10%;
        }

        .aliases {
            height: 45px;
            grid-template-columns: 100px 185px;
            grid-template-rows: 20px 20px;
            grid-gap: 10px 20px;
            grid-row-gap: 5px;
            grid-column-gap: 15px;
        }

        .a {
            background: #d33;
        }

        .b {
            background: #3a6;
        }

        .c {
            background: #36c;
        }

        .d {
            background: #da3;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="grid definite">
            <div class="a"></div>
            <div class="b"></div>
            <div class="c"></div>
            <div class="d"></div>
        </div>
        <div class="grid cyclic">
            <div class="a"></div>
            <div class="b"></div>
        </div>
        <div class="grid aliases">
            <div class="a"></div>
            <div class="b"></div>
            <div class="c"></div>
            <div class="d"></div>
        </div>
    </div>
</body>

</html>
