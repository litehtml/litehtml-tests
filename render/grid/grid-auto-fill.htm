<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Grid auto-fill with fixed tracks</title>
    <style>
        body {
            margin: 0;
            width: 200px;
        }

        .page {
            height: 40px;
        }

        .grid {
            display: grid;
            width: 200px;
            height: 40px;
            grid-template-columns: repeat(auto-fill, 40px);
            grid-auto-rows: 20px;
        }

        .a {
            background: #d33;
        }

        .b {
            background: #3a6;
        }

        .c {
            background: #36c;
        }

        .d {
            background: #da3;
        }

        .e {
            background: #a4a;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="grid">
            <div class="a"></div>
            <div class="b"></div>
            <div class="c"></div>
            <div class="d"></div>
            <div class="e"></div>
            <div class="a"></div>
            <div class="b"></div>
            <div class="c"></div>
        </div>
    </div>
</body>

</html>
