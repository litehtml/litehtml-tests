<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Grid border-box and auto margins</title>
    <style>
        body {
            margin: 0;
            width: 200px;
        }

        .grid {
            display: grid;
            width: 200px;
            height: 60px;
            grid-template-columns: 200px;
            grid-template-rows: 60px;
        }

        .item {
            box-sizing: border-box;
            width: 80px;
            height: 40px;
            padding: 10px;
            border: 5px solid #222;
            margin: auto;
            background: #d33;
        }
    </style>
</head>

<body>
    <div class="grid">
        <div class="item"></div>
    </div>
</body>

</html>
