<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Grid track sizes and repeat</title>
    <style>
        body {
            margin: 0;
            width: 300px;
        }

        .page {
            height: 110px;
        }

        .grid {
            display: grid;
            width: 300px;
            height: 20px;
            margin-bottom: 10px;
        }

        .grid:last-child {
            margin-bottom: 0;
        }

        .percent {
            grid-template-columns: 25% 1fr 2fr;
        }

        .repeat {
            grid-template-columns: repeat(2, 40px 20px) 1fr;
        }

        .minmax {
            grid-template-columns: minmax(10px, 100px) 1fr;
        }

        .partial {
            grid-template-columns: .25fr .25fr;
            justify-content: start;
        }

        .a {
            background: #d33;
        }

        .b {
            background: #3a6;
        }

        .c {
            background: #36c;
        }

        .d {
            background: #da3;
        }

        .e {
            background: #a4a;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="grid percent">
            <div class="a"></div>
            <div class="b"></div>
            <div class="c"></div>
        </div>
        <div class="grid repeat">
            <div class="a"></div>
            <div class="b"></div>
            <div class="c"></div>
            <div class="d"></div>
            <div class="e"></div>
        </div>
        <div class="grid minmax">
            <div class="a"></div>
            <div class="b"></div>
        </div>
        <div class="grid partial">
            <div class="a"></div>
            <div class="b"></div>
        </div>
    </div>
</body>

</html>
