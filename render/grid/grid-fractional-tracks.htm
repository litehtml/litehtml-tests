<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Grid fixed and fractional columns with gaps</title>
    <style>
        body {
            margin: 0;
            width: 300px;
        }

        .grid {
            display: grid;
            width: 300px;
            height: 50px;
            grid-template-columns: 100px 1fr 2fr;
            grid-auto-rows: 20px;
            gap: 10px;
        }

        .a {
            background: #d33;
        }

        .b {
            background: #3a6;
        }

        .c {
            background: #36c;
        }

        .d {
            background: #da3;
        }
    </style>
</head>

<body>
    <div class="grid">
        <div class="a"></div>
        <div class="b"></div>
        <div class="c"></div>
        <div class="d"></div>
    </div>
</body>

</html>
