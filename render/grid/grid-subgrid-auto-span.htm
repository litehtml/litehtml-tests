<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Automatic subgrid span</title>
    <style>
        body {
            margin: 0;
            width: 120px;
        }

        .page {
            height: 20px;
        }

        .parent {
            display: grid;
            width: 120px;
            grid-template-columns: repeat(4, 30px);
            grid-template-rows: 20px;
        }

        .subgrid {
            display: grid;
            grid-template-columns: subgrid [a] [b] [c];
        }

        .first {
            background: #d33;
        }

        .second {
            background: #3a6;
        }

        .third {
            background: #36c;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="parent">
            <div class="subgrid">
                <div class="first"></div>
                <div class="second"></div>
            </div>
            <div class="third"></div>
        </div>
    </div>
</body>

</html>
