<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Subgrid intrinsic column sizing</title>
    <style>
        body {
            margin: 0;
            width: 300px;
        }

        .page {
            height: 20px;
        }

        .parent {
            display: grid;
            width: 300px;
            grid-template-columns: max-content max-content;
            grid-template-rows: 20px;
            column-gap: 10px;
            justify-content: start;
        }

        .subgrid {
            display: grid;
            grid-column: 1 / 3;
            grid-template-columns: subgrid;
        }

        .first {
            width: 40px;
            background: #d33;
        }

        .second {
            width: 100px;
            background: #3a6;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="parent">
            <div class="subgrid">
                <div class="first"></div>
                <div class="second"></div>
            </div>
        </div>
    </div>
</body>

</html>
