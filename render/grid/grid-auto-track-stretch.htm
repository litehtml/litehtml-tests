<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Grid automatic tracks and content stretching</title>
    <style>
        body {
            margin: 0;
            width: 300px;
        }

        .page {
            height: 150px;
        }

        .stretch {
            display: grid;
            width: 200px;
            height: 100px;
            margin-bottom: 10px;
            grid-template-columns: auto auto;
            grid-template-rows: auto auto;
            justify-content: stretch;
            align-content: stretch;
        }

        .stretch .content {
            width: 20px;
            height: 20px;
        }

        .flow {
            display: grid;
            width: 300px;
            height: 40px;
            grid-template-rows: 20px 20px;
            grid-auto-columns: minmax(0, 1fr);
            grid-auto-flow: column;
        }

        .a {
            background: #d33;
        }

        .b {
            background: #3a6;
        }

        .c {
            background: #36c;
        }

        .d {
            background: #da3;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="stretch">
            <div class="a">
                <div class="content"></div>
            </div>
            <div class="b">
                <div class="content"></div>
            </div>
            <div class="c">
                <div class="content"></div>
            </div>
            <div class="d">
                <div class="content"></div>
            </div>
        </div>
        <div class="flow">
            <div class="a"></div>
            <div class="b"></div>
            <div class="c"></div>
            <div class="d"></div>
        </div>
    </div>
</body>

</html>
