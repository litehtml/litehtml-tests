<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Grid distributed alignment falls back to start on overflow</title>
    <style>
        body {
            margin: 0;
            width: 200px;
        }

        .page {
            height: 50px;
        }

        .grid {
            display: grid;
            width: 100px;
            height: 20px;
            margin-left: 50px;
            margin-bottom: 10px;
            grid-template-columns: 80px 80px;
            grid-template-rows: 20px;
        }

        .around {
            justify-content: space-around;
        }

        .evenly {
            justify-content: space-evenly;
            margin-bottom: 0;
        }

        .a {
            background: #d33;
        }

        .b {
            background: #3a6;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="grid around">
            <div class="a"></div>
            <div class="b"></div>
        </div>
        <div class="grid evenly">
            <div class="a"></div>
            <div class="b"></div>
        </div>
    </div>
</body>

</html>
