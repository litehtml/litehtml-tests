<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Grid item box sizing and positioned children</title>
    <style>
        body {
            margin: 0;
            width: 200px;
        }

        .page {
            height: 130px;
        }

        .grid {
            display: grid;
            position: relative;
            width: 200px;
            height: 80px;
            margin-bottom: 20px;
            grid-template-columns: 100px 100px;
            grid-template-rows: 80px;
            justify-items: start;
            align-items: start;
        }

        .first {
            width: 40px;
            height: 20px;
            padding: 5px;
            border: 5px solid #222;
            margin: 10px;
            background: #d33;
        }

        .second {
            width: 20px;
            height: 15px;
            justify-self: end;
            align-self: end;
            position: relative;
            left: 7px;
            top: 5px;
            background: #36c;
        }

        .absolute {
            position: absolute;
            left: 4px;
            top: 4px;
            width: 8px;
            height: 8px;
            background: #da3;
        }

        .images {
            display: grid;
            width: 200px;
            height: 30px;
            grid-template-columns: 100px 100px;
            grid-template-rows: 30px;
        }

        .images img {
            justify-self: center;
            align-self: center;
        }

        .fill {
            background: #3a6;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="grid">
            <div class="first"></div>
            <div class="absolute"></div>
            <div class="second"></div>
        </div>
        <div class="images"><img src="../green16.png">
            <div class="fill"></div>
        </div>
    </div>
</body>

</html>
