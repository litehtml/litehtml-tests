<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Grid fit-content track sizing</title>
    <style>
        body {
            margin: 0;
            width: 300px;
        }

        .page {
            height: 170px;
        }

        .grid {
            display: grid;
            width: 300px;
            margin-bottom: 20px;
        }

        .grid:last-child {
            margin-bottom: 0;
        }

        .clamp {
            grid-template-columns: fit-content(60px) 1fr;
            grid-template-rows: 20px;
        }

        .clamp .a {
            width: 120px;
        }

        .below {
            grid-template-columns: fit-content(200px) 1fr;
            grid-template-rows: 20px;
        }

        .below .a {
            width: 100px;
        }

        .percent {
            width: 200px;
            grid-template-columns: fit-content(50%) 1fr;
            grid-template-rows: 20px;
        }

        .percent .a {
            width: 150px;
        }

        .row-clamp {
            background: #eee;
            grid-template-columns: 300px;
            grid-template-rows: fit-content(30px);
        }

        .row-clamp .a {
            width: 150px;
            height: 50px;
        }

        .a {
            background: #d33;
        }

        .b {
            background: #3a6;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="grid clamp">
            <div class="a"></div>
            <div class="b"></div>
        </div>
        <div class="grid below">
            <div class="a"></div>
            <div class="b"></div>
        </div>
        <div class="grid percent">
            <div class="a"></div>
            <div class="b"></div>
        </div>
        <div class="grid row-clamp">
            <div class="a"></div>
        </div>
    </div>
</body>

</html>
