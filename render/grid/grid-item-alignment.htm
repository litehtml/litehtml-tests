<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Grid item alignment values</title>
    <style>
        body {
            margin: 0;
            width: 300px;
        }

        .page {
            height: 290px;
        }

        .grid {
            display: grid;
            width: 300px;
            height: 40px;
            margin-bottom: 10px;
            grid-template-columns: 100px;
            grid-template-rows: 40px;
        }

        .grid:last-child {
            margin-bottom: 0;
        }

        .item {
            background: #d33;
            width: 20px;
            height: 10px;
        }

        .start {
            justify-items: start;
            align-items: start;
        }

        .center {
            justify-items: center;
            align-items: center;
        }

        .end {
            justify-items: end;
            align-items: end;
        }

        .override {
            justify-items: end;
            align-items: end;
        }

        .override .item {
            justify-self: start;
            align-self: start;
        }

        .stretch {
            justify-items: stretch;
            align-items: stretch;
        }

        .stretch .item,
        .normal .item {
            width: auto;
            height: auto;
        }

        .normal {
            justify-items: normal;
            align-items: normal;
        }

        .normal .item {
            justify-self: auto;
            align-self: auto;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="grid start">
            <div class="item"></div>
        </div>
        <div class="grid center">
            <div class="item"></div>
        </div>
        <div class="grid end">
            <div class="item"></div>
        </div>
        <div class="grid override">
            <div class="item"></div>
        </div>
        <div class="grid stretch">
            <div class="item"></div>
        </div>
        <div class="grid normal">
            <div class="item"></div>
        </div>
    </div>
</body>

</html>
