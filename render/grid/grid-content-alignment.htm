<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Grid content alignment values</title>
    <style>
        body {
            margin: 0;
            width: 300px;
        }

        .page {
            height: 460px;
        }

        .grid {
            display: grid;
            width: 300px;
            height: 60px;
            margin-bottom: 20px;
            grid-template-columns: 60px 60px;
            grid-template-rows: 12px 12px;
        }

        .grid:last-child {
            margin-bottom: 0;
        }

        .start {
            justify-content: start;
            align-content: start;
        }

        .end {
            justify-content: end;
            align-content: end;
        }

        .center {
            justify-content: center;
            align-content: center;
        }

        .between {
            justify-content: space-between;
            align-content: space-between;
        }

        .around {
            justify-content: space-around;
            align-content: space-around;
        }

        .evenly {
            justify-content: space-evenly;
            align-content: space-evenly;
        }

        .a {
            background: #d33;
        }

        .b {
            background: #3a6;
        }

        .c {
            background: #36c;
        }

        .d {
            background: #da3;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="grid start">
            <div class="a"></div>
            <div class="b"></div>
            <div class="c"></div>
            <div class="d"></div>
        </div>
        <div class="grid end">
            <div class="a"></div>
            <div class="b"></div>
            <div class="c"></div>
            <div class="d"></div>
        </div>
        <div class="grid center">
            <div class="a"></div>
            <div class="b"></div>
            <div class="c"></div>
            <div class="d"></div>
        </div>
        <div class="grid between">
            <div class="a"></div>
            <div class="b"></div>
            <div class="c"></div>
            <div class="d"></div>
        </div>
        <div class="grid around">
            <div class="a"></div>
            <div class="b"></div>
            <div class="c"></div>
            <div class="d"></div>
        </div>
        <div class="grid evenly">
            <div class="a"></div>
            <div class="b"></div>
            <div class="c"></div>
            <div class="d"></div>
        </div>
    </div>
</body>

</html>
