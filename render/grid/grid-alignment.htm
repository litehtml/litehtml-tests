<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Grid item and content alignment</title>
    <style>
        body {
            margin: 0;
            width: 320px;
        }

        .page {
            height: 180px;
        }

        .grid {
            display: grid;
        }

        .first {
            width: 300px;
            height: 100px;
            margin-bottom: 20px;
            grid-template-columns: 100px 100px;
            grid-template-rows: 40px;
            justify-content: space-between;
            align-content: center;
        }

        .first .a {
            width: 20px;
            height: 20px;
            justify-self: end;
            align-self: end;
        }

        .first .b {
            width: 30px;
            height: 10px;
            margin-left: auto;
            margin-top: auto;
        }

        .second {
            width: 320px;
            height: 60px;
            grid-template-columns: 40px 40px;
            grid-template-rows: 20px;
            justify-content: space-evenly;
            align-content: end;
        }

        .a {
            background: #d33;
        }

        .b {
            background: #3a6;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="grid first">
            <div class="a"></div>
            <div class="b"></div>
        </div>
        <div class="grid second">
            <div class="a"></div>
            <div class="b"></div>
        </div>
    </div>
</body>

</html>
