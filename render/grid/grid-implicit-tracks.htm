<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Implicit grid tracks on both axes</title>
    <style>
        body {
            margin: 0;
            width: 260px;
        }

        .page {
            height: 90px;
        }

        .first {
            display: grid;
            width: 260px;
            height: 50px;
            margin-bottom: 20px;
            grid-template-columns: 100px 100px;
            grid-template-rows: 20px;
            grid-auto-columns: 30px;
            grid-auto-rows: 15px;
        }

        .first .a {
            grid-column: -4 / -3;
            grid-row: 1;
        }

        .first .b {
            grid-column: 1;
            grid-row: 1;
        }

        .first .c {
            grid-column: 2;
            grid-row: 1;
        }

        .first .d {
            grid-column: 4;
            grid-row: 1;
        }

        .first .e {
            grid-column: 1;
            grid-row: 3;
        }

        .second {
            display: grid;
            width: 210px;
            height: 20px;
            grid-template-columns: none;
            grid-template-rows: 20px;
            grid-auto-columns: 70px;
            grid-auto-flow: column;
            justify-content: start;
        }

        .a {
            background: #d33;
        }

        .b {
            background: #3a6;
        }

        .c {
            background: #36c;
        }

        .d {
            background: #da3;
        }

        .e {
            background: #a4a;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="first">
            <div class="a"></div>
            <div class="b"></div>
            <div class="c"></div>
            <div class="d"></div>
            <div class="e"></div>
        </div>
        <div class="second">
            <div class="a"></div>
            <div class="b"></div>
            <div class="c"></div>
        </div>
    </div>
</body>

</html>
