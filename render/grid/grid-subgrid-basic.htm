<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Subgrid inherited tracks</title>
    <style>
        body {
            margin: 0;
            width: 230px;
        }

        .page {
            height: 60px;
        }

        .parent {
            display: grid;
            width: 230px;
            grid-template-columns: 40px 70px 100px;
            grid-template-rows: 20px 30px;
            gap: 10px;
        }

        .subgrid {
            display: grid;
            grid-column: 2 / 4;
            grid-row: 1 / 3;
            grid-template-columns: subgrid;
            grid-template-rows: subgrid;
            width: 10px;
            height: 10px;
            justify-self: end;
            align-self: end;
        }

        .a {
            background: #d33;
        }

        .b {
            background: #3a6;
        }

        .c {
            background: #36c;
        }

        .d {
            background: #da3;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="parent">
            <div class="subgrid">
                <div class="a"></div>
                <div class="b"></div>
                <div class="c"></div>
                <div class="d"></div>
            </div>
        </div>
    </div>
</body>

</html>
