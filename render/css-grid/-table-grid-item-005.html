<!doctype html>

<meta charset="utf-8">
<title>Table sizing inside a fixed sized grid</title>
<link rel="help" href="https://crbug.com/667785">
<style>

  .grid {
    display: grid;
    width: 400px;
    height: 400px;
    border: 1px solid black;
    background: red;
  }

  .item {
    display: table;
    background: lime;
  }

  caption {
    background: grey;
  }

</style>

<pre>There should be no red areas:</pre>

<p>Table with one cell</p>
<div class="grid">
  <div class="item">
    table cell
  </div>
</div>

<p>Empty table with caption</p>
<div class="grid">
  <table class="item">
    <caption>caption</caption>
  </table>
</div>

<p>Table with caption and cell</p>
<div class="grid">
  <table class="item">
    <caption>caption</caption>
    <tr><td>table cell</td></tr>
  </table>
</div>
