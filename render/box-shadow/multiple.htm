<!DOCTYPE html>
<html>
<head>
<title>multiple box shadows</title>
<style>
    body { margin: 0; background: #fff; font: 14px serif; }
    .box {
        display: inline-block;
        width: 120px;
        height: 80px;
        margin: 35px 40px;
        background: #fff;
        vertical-align: top;
    }
    #a { box-shadow: 0 0 0 3px #c00, 0 0 0 6px #0c0, 0 0 0 9px #00c; }
    #b { box-shadow: 6px 6px 8px rgba(0, 0, 0, 0.4), -6px -6px 8px rgba(0, 0, 0, 0.2); }
    #c {
        background: #eee;
        box-shadow: inset 0 0 10px #000, 0 0 0 2px #08c, 4px 4px 8px rgba(0, 0, 0, 0.35);
    }
    #d { border-radius: 18px; box-shadow: 0 8px 12px rgba(0, 0, 0, 0.4), inset 0 -4px 8px rgba(0, 0, 0, 0.25); }
    #e { box-shadow: 2px 2px 0 #f00, 4px 4px 0 #0f0, 6px 6px 0 #00f, 8px 8px 0 #000; }
</style>
</head>
<body>
<div class="box" id="a"></div>
<div class="box" id="b"></div>
<div class="box" id="c"></div>
<div class="box" id="d"></div>
<div class="box" id="e"></div>
</body>
</html>
