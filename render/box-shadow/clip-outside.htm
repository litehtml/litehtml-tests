<!DOCTYPE html>
<html>
<head>
<title>box-shadow paints outside the border box only</title>
<style>
    body { margin: 0; background: #fff; font: 14px serif; }
    .row { white-space: nowrap; }
    .box {
        display: inline-block;
        width: 110px;
        height: 80px;
        margin: 30px 35px;
        vertical-align: top;
    }
    /* Transparent element: only the 1px ring may be visible. */
    #ring { box-shadow: 0 0 0 1px #808080; }
    /* Transparent element with an offset: the interior must stay unpainted. */
    #offset { box-shadow: 10px 10px 0 #08c; }
    /* Blurred shadow is cut out at the border box, not blurred into the interior. */
    #blur { box-shadow: 0 0 10px 2px rgba(0, 0, 0, 0.6); }
    /* Semi-transparent background shows the page, never the outer shadow, through it. */
    #semi { background: rgba(0, 128, 0, 0.4); box-shadow: 0 0 0 20px #f00; }
    /* The image has transparent corners; they must show the page, not the shadow. */
    #image { width: 40px; height: 40px; margin: 50px 60px; box-shadow: 0 0 0 2px #c00; }
</style>
</head>
<body>
<div class="row">
    <div class="box" id="ring"></div>
    <div class="box" id="offset"></div>
    <div class="box" id="blur"></div>
</div>
<div class="row">
    <div class="box" id="semi"></div>
    <img id="image" src="../star.png" alt="star">
</div>
</body>
</html>
