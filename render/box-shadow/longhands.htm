<!DOCTYPE html>
<html>
<head>
<title>box-shadow longhands</title>
<style>
    body { margin: 0; background: #f2f2f2; font: 14px serif; }
    .box {
        display: inline-block;
        width: 110px;
        height: 80px;
        margin: 35px 45px;
        background: #fff;
        vertical-align: top;
    }
    /* one shadow built from all longhands */
    #a {
        box-shadow-offset: 8px 8px;
        box-shadow-blur: 6px;
        box-shadow-spread: 2px;
        box-shadow-color: #c33;
        box-shadow-position: outset;
    }
    /* lists: shorter lists repeat */
    #b {
        box-shadow-offset: 4px 4px, 10px 10px;
        box-shadow-blur: 3px;
        box-shadow-color: #08c, #0a0;
        box-shadow-spread: 0, 2px;
    }
    /* longhands set after the shorthand override only that part */
    #c {
        box-shadow: 6px 6px 10px #000;
        box-shadow-color: #f0f;
        box-shadow-blur: 2px;
    }
    /* a longhand without offsets produces no shadow */
    #d {
        box-shadow-color: #f00;
        box-shadow-blur: 8px;
    }
    /* position list */
    #e {
        box-shadow-offset: 0 0;
        box-shadow-blur: 6px;
        box-shadow-spread: 4px;
        box-shadow-color: #333;
        box-shadow-position: inset;
    }
</style>
</head>
<body>
<div class="box" id="a"></div>
<div class="box" id="b"></div>
<div class="box" id="c"></div>
<div class="box" id="d"></div>
<div class="box" id="e"></div>
</body>
</html>
