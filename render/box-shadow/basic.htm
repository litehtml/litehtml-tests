<!DOCTYPE html>
<html>
<head>
<title>box-shadow basic</title>
<style>
    body { margin: 0; background: #f0f0f0; font: 14px serif; }
    .box {
        display: inline-block;
        width: 120px;
        height: 70px;
        margin: 30px 35px;
        background: #fff;
        vertical-align: top;
    }
    #a { box-shadow: 10px 10px #000; }
    #b { box-shadow: -8px 6px #c00; }
    #c { box-shadow: 4px 4px 12px rgba(0, 0, 0, 0.5); }
    #d { box-shadow: 0 0 0 6px #06c; }
    #e { background: #ffe; box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.3), 0 0 0 2px #09c; }
    #f { color: #c00; box-shadow: 5px 5px 4px; }
    #g { background: #fff; padding: 6px 12px; box-shadow: 3px 3px 6px rgba(0, 0, 0, 0.6); }
    p { margin: 10px 40px; }
</style>
</head>
<body>
<div class="box" id="a"></div>
<div class="box" id="b"></div>
<div class="box" id="c"></div>
<div class="box" id="d"></div>
<div class="box" id="e"></div>
<div class="box" id="f"></div>
<p><span id="g">inline shadow</span></p>
</body>
</html>
