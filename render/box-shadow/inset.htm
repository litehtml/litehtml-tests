<!DOCTYPE html>
<html>
<head>
<title>box-shadow inset</title>
<style>
    body { margin: 0; background: #e8e8e8; font: 14px serif; }
    .box {
        display: inline-block;
        width: 120px;
        height: 90px;
        margin: 30px 35px;
        background: #fff;
        vertical-align: top;
    }
    #a { box-shadow: inset 6px 6px 0 0 #000; }
    #b { box-shadow: inset 0 0 12px 2px rgba(0, 0, 0, 0.6); }
    #c { box-shadow: inset -5px 5px 8px #c00; border-radius: 20px; }
    #d { box-shadow: inset 0 0 0 6px #39f; border-radius: 50%; }
    #e {
        background: #ffd;
        box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.5), inset -3px -3px 6px rgba(255, 255, 255, 0.9);
    }
    #f { border: 8px solid #ddd; box-shadow: inset 0 0 10px 4px #080; }
</style>
</head>
<body>
<div class="box" id="a"></div>
<div class="box" id="b"></div>
<div class="box" id="c"></div>
<div class="box" id="d"></div>
<div class="box" id="e"></div>
<div class="box" id="f"></div>
</body>
</html>
