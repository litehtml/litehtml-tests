<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>table-layout: fixed - pixel columns widen the table</title>
<style>
html, body { margin: 0; padding: 0; }
table { table-layout: fixed; width: 75px; border-collapse: collapse; }
td { padding: 0; border: 0; font-size: 0; line-height: 0; }
.fill { height: 20px; }
.a { background: #d00; }
.b { background: #0a0; }
.c { background: #00d; }
.d { background: #a0a; }
.ref { height: 10px; margin-top: 10px; font-size: 0; }
.ref div { display: inline-block; height: 10px; vertical-align: top; }
</style>
</head>
<body>
<table>
<tr>
<td style="width: 25px"><div class="fill a"></div></td>
<td style="width: 25px"><div class="fill b"></div></td>
<td style="width: 25px"><div class="fill c"></div></td>
<td style="width: 25px"><div class="fill d"></div></td>
</tr>
</table>
<div class="ref"><div class="a" style="width: 25px"></div><div class="b" style="width: 25px"></div><div class="c" style="width: 25px"></div><div class="d" style="width: 25px"></div></div>
</body>
</html>
