<!doctype html>
<title>Positioned padding preserves static offsets and descendant percentage bases</title>
<link rel="match" href="support/positioned-percentage-padding-standards-ref.htm">
<style>
    body { margin: 0; }
    .outer { position: relative; width: 400px; height: 300px; background: orange; }
    .parent { width: 100px; margin-left: 30px; padding-top: 20px; background: lightblue; }
    .absolute { position: absolute; padding: 10%; height: 100px; background: tomato; }
    .content { width: 60px; height: 100px; background: green; }
    .child { width: 100%; height: 20px; padding-top: 10%; background: blue; }
    .control { width: 100px; margin-top: 20px; }
    .normal { padding: 10%; height: 20px; background: green; }
</style>
<div class="outer"><div class="parent"><div class="absolute"><div class="content"><div class="child"></div></div></div></div></div>
<div class="control"><div class="normal"></div></div>
