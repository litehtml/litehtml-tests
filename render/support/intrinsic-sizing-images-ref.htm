<!doctype html>
<title>Intrinsic replaced image sizing reference</title>

    img { display: block; width: 16px; height: 16px; }
    .small { width: 8px; height: 8px; }
    .large { width: 40px; height: 40px; }
    .border { box-sizing: content-box; padding: 4px; border: 2px solid black; }
</style>
