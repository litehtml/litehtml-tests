<!doctype html>
<title>Float and positioned descendant reference</title>
<style>
    body { margin: 0; }
    .host { width: 80px; height: 60px; margin-bottom: 5px; background: #ccc; }
    .box { width: 50px; height: 30px; background: green; }
    .child { height: 30px; }
    .float { float: left; width: 20px; height: 30px; background: red; }
    .after { clear: both; width: 50px; height: 10px; background: blue; }
    .positioned { position: relative; }
    .absolute { position: absolute; left: 45px; top: 15px; width: 10px; height: 10px; background: red; }
    .margin-child { height: 20px; margin-bottom: 10px; }
    .margin-box { height: 20px; }
    .auto { height: auto; }
    .flex { display: flex; flex-direction: column; height: 40px; }
    .item { width: 20px; height: 20px; flex: 0 0 20px; background: red; }
    .item + .item { background: blue; }
</style>
<div class="host"><div class="box"><div class="float"></div><div class="child"></div></div><div class="after"></div></div>
<div class="host"><div class="box positioned"><div class="child"></div><div class="absolute"></div></div><div class="after"></div></div>
<div class="host"><div class="box margin-box"><div class="margin-child"></div></div><div class="after"></div></div>
<div class="host"><div class="box margin-box"><div class="margin-child"></div></div><div class="after"></div></div>
<div class="host"><div class="box auto"><div class="margin-child"></div></div><div class="after"></div></div>
<div class="host"><div class="box flex"><div class="item"></div><div class="item"></div></div></div>
