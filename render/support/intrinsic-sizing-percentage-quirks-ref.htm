<title>Intrinsic heights in quirks mode reference</title>
<style>
    body { margin: 0; }
    .host { width: 50px; height: 100px; margin-bottom: 5px; background: #ccc; }
    .box { width: 50px; height: 30px; background: #080; }
    .child { height: 30px; background: #c00; }
    .automatic, .automatic .child { height: 50px; }
    .minimum { height: 20px; }
    .minimum .child { height: 10px; }
    .maximum, .maximum .child { height: 40px; }
</style>
<div class="host"><div class="box"><div class="child"></div></div></div>
<div class="host"><div class="box automatic"><div class="child"></div></div></div>
<div class="host"><div class="box minimum"><div class="child"></div></div></div>
<div class="host"><div class="box maximum"><div class="child"></div></div></div>
