<!doctype html>
<title>Intrinsic flex height constraint reference</title>
<style>
    body { margin: 0; }
    .host { width: 50px; height: 100px; margin-bottom: 5px; background: #ccc; }
    .green { width: 50px; height: 20px; background: #080; }
    .blue { width: 50px; height: 80px; background: blue; }
    .large { height: 70px; }
    .small { height: 30px; }
    .padded { height: 34px; }
    .padded-large { height: 84px; }
    .remainder { height: 66px; }
    .remainder-small { height: 16px; }
    .middle { height: 30px; }
    .remainder-middle { height: 70px; }
    .image { height: 50px; background: #0f0; }
    .half { height: 50px; }
</style>
<div class="host"><div class="green"></div><div class="blue"></div></div>
<div class="host"><div class="green large"></div><div class="blue small"></div></div>
<div class="host"><div class="green large"></div><div class="blue small"></div></div>
<div class="host"><div class="green"></div><div class="blue"></div></div>
<div class="host"><div class="green padded"></div><div class="blue remainder"></div></div>
<div class="host"><div class="green padded-large"></div><div class="blue remainder-small"></div></div>
<div class="host"><div class="green padded"></div><div class="blue remainder"></div></div>
<div class="host"><div class="green middle"></div><div class="blue remainder-middle"></div></div>
<div class="host"><div class="green image"></div><div class="blue half"></div></div>
<div class="host"><div class="green"></div><div class="blue"></div></div>
